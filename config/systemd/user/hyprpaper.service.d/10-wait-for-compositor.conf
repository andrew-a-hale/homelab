[Unit]
# At login hyprpaper can start before the compositor's Wayland socket accepts
# connections ("wl_display_connect failed"). The shipped unit is
# Restart=on-failure, which gives up after the start limit and leaves no
# wallpaper for the whole session. Keep retrying instead.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=3
