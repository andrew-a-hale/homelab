# Wallpaper: one static image, no themes, no cycling.
#
# hyprpaper 0.8 syntax: one `wallpaper { }` block per monitor. The old
# `wallpaper = monitor,path` one-liner is not valid here and fails silently with
# "Monitor DP-2 has no target".
#
# `~/Pictures/wallpaper.png` must exist. The Omarchy theme backgrounds are
# .webp and hyprpaper cannot read webp (no libwebp in its dependencies), so:
#   ffmpeg -i /usr/share/omarchy/themes/ethereal/backgrounds/1-cosmic.webp ~/Pictures/wallpaper.png

wallpaper {
    monitor = DP-2
    path = ~/Pictures/wallpaper.png
    fit_mode = cover
}

wallpaper {
    monitor = DP-1
    path = ~/Pictures/wallpaper.png
    fit_mode = cover
}

# fit_mode: cover (fill, crop), contain, tile.
splash = false
ipc = on
