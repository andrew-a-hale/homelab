-- Wallpaper: one static image, no themes, no cycling.
-- ponytail: ~/Pictures/wallpaper.png must exist before this is useful. Grab one
-- before the [omarchy] repo goes — the theme backgrounds are .webp and hyprpaper
-- cannot read webp, so convert:
--   ffmpeg -i /usr/share/omarchy/themes/ethereal/backgrounds/1-cosmic.webp ~/Pictures/wallpaper.png
-- hyprpaper does not scale by default; `cover` fills the display without bars.
wallpaper = ,~/Pictures/wallpaper.png
splash = false
ipc = on
