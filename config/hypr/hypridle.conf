# Idle: lock after 2.5 minutes, then turn the displays off. A desktop, so no
# suspend. ponytail: two listeners, no screensaver process — hyprlock is the
# screensaver.

general {
    lock_cmd = hyprlock
    before_sleep_cmd = hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

# 2.5 min: lock.
listener {
    timeout = 150
    on-timeout = pgrep -x hyprlock >/dev/null || hyprlock
}

# 3 min: displays off. Anything that touches the machine brings them back.
listener {
    timeout = 180
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
