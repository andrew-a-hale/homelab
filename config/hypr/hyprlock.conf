# hyprlock — flat dark lock screen, no theme files. Colours match waybar.
general {
    ignore_empty_input = true
}

background {
    monitor =
    color = rgb(1a1b26)
}

label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 72
    color = rgb(c0caf5)
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A %d %B'
    font_family = JetBrainsMono Nerd Font
    font_size = 14
    color = rgb(565f89)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    position = 0, -60
    halign = center
    valign = center
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.4
    outer_color = rgb(7aa2f7)
    inner_color = rgb(1a1b26)
    font_color = rgb(c0caf5)
    placeholder_text = <span foreground="##565f89">password</span>
}

fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
