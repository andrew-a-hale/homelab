# Limine boot entries for jason. Deployed to
# /etc/limine-entry-tool.d/zz-jason.conf.
#
# Why this file exists: limine-entry-tool's own UKI settings live in drop-ins
# owned by whatever package installed it. This file carries the load-bearing
# parts itself, so nothing else has to be installed for the boot to work:
#   * build UKIs                  -> ENABLE_UKI
#   * name them arch_linux*.efi   -> CUSTOM_UKI_NAME (the existing files in
#                                    /boot/EFI/Linux/ already have that name, and
#                                    the OS entry in limine.conf is matched by
#                                    machine-id, so neither is renamed)
#   * title the OS entry `Arch`   -> TARGET_OS_NAME
#
# `zz-` so it is read last and wins over any other drop-in.

ENABLE_UKI=yes
CUSTOM_UKI_NAME="arch"
TARGET_OS_NAME="Arch"

BOOT_ORDER="linux, linux-*, *fallback, Snapshots"
ENABLE_LIMINE_FALLBACK=yes
FIND_BOOTLOADERS=yes

# Snapshot boot entries each carry a full copy of the UKI — 267 MiB — so a 1 GiB
# /boot fits exactly one next to the live image (26% + 26% = 52%). The tool
# refuses anything above LIMIT_USAGE_PERCENT, which is why zero entries existed
# with a 50% limit and two kernels. One is the useful case: boot the last
# pre-upgrade snapshot.
MAX_SNAPSHOT_ENTRIES=1
SNAPSHOT_FORMAT_CHOICE=5
LIMIT_USAGE_PERCENT=70

# Two kernel command-line workarounds worth keeping (the rest of what this file
# once mirrored was plymouth cosmetics, dropped):
#   initramfs_async=0        : async unpack races /init on 7.1+, breaks the
#                              encrypted boot prompt.
#   systemd.tty.term.console : systemd 257+ blocking ANSI console-size query
#                              under Plymouth hangs 1 boot in 10.
KERNEL_CMDLINE[default]+=" initramfs_async=0"
KERNEL_CMDLINE[default]+=" systemd.tty.term.console=dumb"

# NOTE: LIMIT_USAGE_PERCENT is NOT read from this directory — limine-snapper-sync
# takes it from /etc/default/limine (set to 70 there on jason). Each snapshot
# boot entry copies the whole 267M UKI, so with a 1G /boot the ceiling is one
# entry; raising MAX_SNAPSHOT_ENTRIES does nothing until /boot grows.
