# Limine boot entries, without Omarchy. Deployed to
# /etc/limine-entry-tool.d/zz-jason.conf.
#
# Why this file exists: the settings that make UKIs *and* reuse the existing
# EFI filenames live in /etc/limine-entry-tool.d/omarchy-{defaults,uki}.conf,
# both owned by the `omarchy-settings` package. `pacman -Rns omarchy-settings`
# deletes them, and the tool then falls back to its defaults: no UKI, and the
# OS entry named from /etc/os-release. This file carries the load-bearing parts
# so removing the package changes nothing about the boot.
#
# Named `zz-` so it is read *after* omarchy-defaults.conf and wins while that
# package is still installed — that is what lets the boot switch to stock linux
# before the omarchy layer is removed.

ENABLE_UKI=yes
# Reuse the filenames already in /boot/EFI/Linux/ (omarchy_linux.efi,
# omarchy_linux-omarchy.efi) and the OS entry already in limine.conf, which is
# matched by machine-id. Renaming either is a separate, riskier job.
CUSTOM_UKI_NAME="omarchy"
TARGET_OS_NAME="Omarchy"

BOOT_ORDER="linux, linux-*, linux-omarchy, *fallback, Snapshots"
ENABLE_LIMINE_FALLBACK=yes
FIND_BOOTLOADERS=yes

# snapper keeps 5; the sixth can exist briefly during cleanup.
MAX_SNAPSHOT_ENTRIES=6
SNAPSHOT_FORMAT_CHOICE=5

# The two workarounds worth keeping from Omarchy's file (the rest was plymouth
# cosmetics). Duplicated while both files are read; identical values, no harm.
#   initramfs_async=0        : async unpack races /init on 7.1+, breaks the
#                              encrypted boot prompt.
#   systemd.tty.term.console : systemd 257+ blocking ANSI console-size query
#                              under Plymouth hangs 1 boot in 10.
KERNEL_CMDLINE[default]+=" initramfs_async=0"
KERNEL_CMDLINE[default]+=" systemd.tty.term.console=dumb"
