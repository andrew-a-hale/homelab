server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ralph ralph.local localhost _;

    # The live DHT reading, written by dht.service (USB sensor on Ralph).
    # This must stay ahead of the proxy: the repo ships a stale static copy of
    # this file and the Go app has no way to read a USB serial device.
    location = /static/dht.json {
        alias /srv/dht/dht.json;
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # Jellyfin (BaseUrl is /jf, so the prefix is part of the path)
    location = /jf { return 301 /jf/; }
    location /jf/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;              # HLS/websocket playback
        client_max_body_size 0;
    }

    # The Go site: andrewahale.com, placetime, and petcam when it lived here.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
