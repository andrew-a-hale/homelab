# nginx on Ralph (the only public entry point). Two files on the box:
#   /etc/nginx/conf.d/00-upgrade-map.conf
#   /etc/nginx/conf.d/ralph.conf   (below)
#   /etc/nginx/conf.d/petcam.conf  (at the end)

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ralph ralph.local localhost _;

    # The live DHT reading, written by dht.service (USB sensor on Ralph).
    # This must stay ahead of the proxy: the repo ships a stale static copy of
    # this file and the Go app has no way to read a USB serial device.
    location = /static/dht.json {
        alias /srv/dht/dht.json;
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # Jellyfin (BaseUrl is /jf, so the prefix is part of the path)
    location = /jf { return 301 /jf/; }
    location /jf/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;              # HLS/websocket playback
        client_max_body_size 0;
    }

    # The Go site: andrewahale.com, placetime, and petcam when it lived here.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# petcam.andrewahale.com: petcam is its own app on Tom (camera, HLS, gallery and
# the training-label UI all read Tom's /dev/shm and ~/petcam). It binds the
# tailnet address only, so this is the single way in and Tom runs no web server.
server {
    listen 80;
    server_name petcam.andrewahale.com;
    location / {
        proxy_pass http://100.77.132.110:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
