# nginx on Ralph (the only public entry point). Two files on the box:
#   /etc/nginx/conf.d/00-upgrade-map.conf
#   /etc/nginx/conf.d/ralph.conf   (below)
#   /etc/nginx/conf.d/petcam.conf  (at the end)

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ralph ralph.local localhost _;

    # The live DHT reading, written by dht.service (USB sensor on Ralph).
    # This must stay ahead of the proxy: the repo ships a stale static copy of
    # this file and the Go app has no way to read a USB serial device.
    location = /static/dht.json {
        alias /srv/dht/dht.json;
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # qBittorrent WebUI: LAN only, basic auth in front (WebUI is on 127.0.0.1:8081)
    location = /bt { return 301 /bt/; }
    location /bt/ {
        auth_basic "qBittorrent";
        auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Jellyfin (BaseUrl is /jf, so the prefix is part of the path)
    location = /jf { return 301 /jf/; }
    location /jf/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;              # HLS/websocket playback
        client_max_body_size 0;
    }

    # The Go site: andrewahale.com, placetime, and petcam when it lived here.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# petcam.andrewahale.com: split across two boxes since 2026-11-08. Tom is a
# camera appliance — petcam.sh writes /dev/shm/petcam and a dumb static server
# exposes it on the tailnet only (:8081, petcam-static.service), so the browser
# pulls the HLS stream straight from Tom while everything stateful (gallery,
# log, /label, /review, the detector) lives in ~/petcam on this box. The app
# binds loopback, so this is the single way in.
server {
    listen 80;
    server_name petcam.andrewahale.com;

    # Tom's tmpfs stream. /hls/index.m3u8 -> /index.m3u8 on :8081.
    # http.server cannot send Cache-Control and hls.js refetches the playlist,
    # so no-store is added here. Segments are proxied plain.
    location /hls/ {
        proxy_pass http://100.77.132.110:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        # :8082, not :8080 — the website app (andrewhale-web) owns 8080 here.
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
